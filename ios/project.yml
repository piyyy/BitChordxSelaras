# BitChord for iOS. The Xcode project is generated from this file:
#
#   brew install xcodegen && cd ios && xcodegen generate && open BitChord.xcodeproj
#
# CI does the same on a macOS runner; see .github/workflows/ios.yml.
name: BitChord
options:
  bundleIdPrefix: com.music.bitchord
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BitChordCore:
    path: BitChordCore
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.2.0"

targets:
  BitChord:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: BitChordCore
      - package: YouTubeKit
      - sdk: MediaToolbox.framework
    # BitChordKit: the Android app's Compose UI and data layer, compiled by Kotlin/Native
    # (../iosApp). The Gradle task links the framework for this SDK/arch and copies its Compose
    # resources into the app.
    preBuildScripts:
      - name: Build BitChordKit (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          ./gradlew :iosApp:embedAndSignAppleFrameworkForXcode -Pbitchord.ios=true --console=plain
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BitChord
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.music.bitchord.ios
            CFBundleURLSchemes: [bitchord]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord.ios
        PRODUCT_NAME: BitChord
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../iosApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "BitChordKit"]

schemes:
  BitChord:
    build:
      targets:
        BitChord: all
    run:
      config: Debug
    archive:
      config: Release

name: iOS

# Builds BitChord for iOS on a macOS runner and publishes an unsigned .ipa as a workflow artifact.
# Install it on an iPhone with Sideloadly or AltStore, which sign it with your own Apple ID.
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests (parser against web/fixtures, Selaras DSP)
        run: swift test --package-path ios/BitChordCore

  ipa:
    name: Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | xcpretty || (tail -200 build.log; exit 1)

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BitChord.app Payload/
          zip -qry BitChord-unsigned.ipa Payload
          ls -la BitChord-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-iOS-unsigned
          path: BitChord-unsigned.ipa
          retention-days: 30

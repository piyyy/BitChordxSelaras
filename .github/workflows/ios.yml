name: iOS

# Builds BitChord for iOS on a macOS runner and publishes an unsigned .ipa as a workflow artifact.
# Install it on an iPhone with Sideloadly or AltStore, which sign it with your own Apple ID.
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "iosApp/**"
      - "shared/**"
      - "sharedUi/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests (parser against web/fixtures, Selaras DSP)
        run: swift test --package-path ios/BitChordCore
      - name: Live test against music.youtube.com (Apple Foundation)
        continue-on-error: true
        env:
          BITCHORD_LIVE: "1"
        run: swift test --package-path ios/BitChordCore --filter LiveTests

  ipa:
    name: Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | xcpretty || (tail -200 build.log; exit 1)

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BitChord.app Payload/
          zip -qry BitChord-unsigned.ipa Payload
          ls -la BitChord-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-iOS-unsigned
          path: BitChord-unsigned.ipa
          retention-days: 30

  simulator:
    name: Simulator smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build for the simulator
        run: |
          set -o pipefail
          brew install xcodegen
          (cd ios && xcodegen generate)
          xcodebuild -project ios/BitChord.xcodeproj -scheme BitChord -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | xcpretty || (tail -200 build.log; exit 1)
      - name: Launch every tab, screenshot, collect logs
        run: |
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=build/Build/Products/Release-iphonesimulator/BitChord.app
          xcrun simctl install "$UDID" "$APP"
          for tab in 0 1 2 3; do
            xcrun simctl launch --terminate-running-process --stdout="$PWD/shots/tab$tab.log" --stderr="$PWD/shots/tab$tab.log" \
              "$UDID" com.music.bitchord.ios -debugTab $tab -AppleLanguages "(id)" -AppleLocale id_ID || true
            sleep 25
            xcrun simctl io "$UDID" screenshot "shots/tab$tab.png" || true
          done
          # Pushed pages: the first album, playlist and artist Home offers, and Settings.
          for page in album playlist artist settings; do
            xcrun simctl launch --terminate-running-process --stdout="$PWD/shots/$page.log" --stderr="$PWD/shots/$page.log" \
              "$UDID" com.music.bitchord.ios -debugOpen $page -AppleLanguages "(id)" -AppleLocale id_ID || true
            sleep 30
            xcrun simctl io "$UDID" screenshot "shots/$page.png" || true
          done
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "BitChord"' > shots/system.log 2>&1 || true
          tail -50 shots/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-shots
          path: shots
          retention-days: 7
